# XcodeGen spec. The .xcodeproj and Sources/Info.plist are generated by `xcodegen generate` on the macOS runner and are
# not checked in. This file also goes into the public build copy (scripts/publish-public.sh): nothing personal here.
name: GupWorks
options:
  bundleIdPrefix: app.gupworks
  deploymentTarget:
    iOS: "16.0"
targets:
  GupWorks:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
      # the web UI (repo-root web/), copied in as a folder so the app bundle keeps web/index.html and its subfolders
      - path: ../web
        type: folder
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: GupWorks
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBG
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UIUserInterfaceStyle: Dark
        CADisableMinimumFrameDurationOnPhone: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # pairing: the app scans the QR code the PC shows (the camera picture never leaves the phone)
        NSCameraUsageDescription: >-
          GupWorks uses the camera only to scan the pairing code your PC shows. Nothing is recorded or sent anywhere.
        # app lock and owner decisions (iOS checks the face; the app only hears "passed" or "not")
        NSFaceIDUsageDescription: >-
          GupWorks uses Face ID to unlock the app and to confirm each decision you make for your PC.
        # voice input in Gup chat: the microphone feeds on-device speech recognition only (no audio leaves the phone)
        NSMicrophoneUsageDescription: >-
          GupWorks listens only while the voice sheet in Gup chat is open, to turn what you say into text. Nothing is
          recorded, and no audio leaves your iPhone.
        NSSpeechRecognitionUsageDescription: >-
          GupWorks turns your voice into text on this iPhone (on-device speech recognition) so you can talk to Gup.
          Only the text you choose to send goes to your PC.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gupworks.mobile
        PRODUCT_NAME: GupWorks
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
