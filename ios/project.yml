# XcodeGen spec. The .xcodeproj and Sources/Info.plist are generated by `xcodegen generate` on the macOS runner and are
# not checked in. This file also goes into the public build copy (scripts/publish-public.sh): nothing personal here.
name: GupWorks
options:
  bundleIdPrefix: app.gupworks
  deploymentTarget:
    iOS: "16.0"
targets:
  GupWorks:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
      # the web UI (repo-root web/), copied in as a folder so the app bundle keeps web/index.html and its subfolders
      - path: ../web
        type: folder
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: GupWorks
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBG
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UIUserInterfaceStyle: Dark
        CADisableMinimumFrameDurationOnPhone: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gupworks.mobile
        PRODUCT_NAME: GupWorks
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
