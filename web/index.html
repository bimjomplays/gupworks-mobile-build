<!doctype html>
<!-- Placeholder: proves the iOS shell loads the bundled web/ folder. The real glass UI replaces it in the next slice.
     Opens in any desktop browser too. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>GupWorks</title>
<style>
  html, body { margin: 0; height: 100%; background: #121212; color: #eef1fa; }
  body {
    font: 19px/1.45 -apple-system, system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
    box-sizing: border-box; text-align: center;
    -webkit-user-select: none; user-select: none;
  }
  .card {
    padding: 28px 30px; border-radius: 26px; max-width: 420px;
    background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.12);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  }
  h1 { margin: 0 0 8px; font-size: 32px; }
  p { margin: 0; color: #b9c0d4; }
  #where { margin-top: 14px; font-size: 15px; color: #8a93ab; }
</style>
</head>
<body>
  <div class="card">
    <h1>GupWorks</h1>
    <p>The iPhone shell is running. The real app UI arrives in the next build.</p>
    <p id="where"></p>
  </div>
<script>
  document.getElementById("where").textContent =
    location.protocol === "file:" ? "Loaded from the app bundle" : "Loaded from " + location.host;
</script>
</body>
</html>
